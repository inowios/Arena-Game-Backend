# Arena City (Matchday Club) API on the shared VPS: arenacity.arenaproplay.com → 127.0.0.1:8083.
# The same Cloudflare origin certificate as api.arenaproplay.com (Arena_Backend/deploy/nginx/proplayarena.conf);
# it covers *.arenaproplay.com when it was issued with Cloudflare's default host list (setup.sh checks).

# Behind the Cloudflare proxy the client is CF-Connecting-IP (the server's rate limits key on X-Real-IP).
map $http_cf_connecting_ip $arenacity_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name arenacity.arenaproplay.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name arenacity.arenaproplay.com;

    ssl_certificate /etc/ssl/cloudflare-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare-key.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $arenacity_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
