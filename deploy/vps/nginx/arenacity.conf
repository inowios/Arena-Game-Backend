# Arena City API on the shared VPS: arenacity.arenaproplay.com → 127.0.0.1:8084.
# Behind the Cloudflare proxy (orange cloud): Cloudflare serves the public certificate, this one only secures the hop
# Cloudflare → VPS. /etc/ssl/arenacity/ holds its own key pair — setup.sh makes a self-signed one (enough for the
# Cloudflare SSL mode "Full"); for "Full (strict)" put a Cloudflare Origin Certificate there under the same names.

# Behind the Cloudflare proxy the client is CF-Connecting-IP (the server's rate limits key on X-Real-IP).
map $http_cf_connecting_ip $arenacity_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name arenacity.arenaproplay.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name arenacity.arenaproplay.com;

    ssl_certificate /etc/ssl/arenacity/cert.pem;
    ssl_certificate_key /etc/ssl/arenacity/key.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $arenacity_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
