name: matchdayclub
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-matchdayclub}
      POSTGRES_USER: ${DATABASE_USER:-matchday}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-matchday}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "127.0.0.1:5433:5432" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-matchday}" ], interval: 5s, timeout: 3s, retries: 20 }
  app:
    build: .
    image: ${APP_IMAGE:-matchdayclub/server:local}
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-matchdayclub}
      DATABASE_USER: ${DATABASE_USER:-matchday}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-matchday}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.matchdayclub.app}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.inowios.matchdayclub}
      CORS_ALLOWED_HOSTS: ${CORS_ALLOWED_HOSTS:-}
      KTOR_DEVELOPMENT: ${KTOR_DEVELOPMENT:-false}
      IAP_DEV_MODE: ${IAP_DEV_MODE:-false}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
    ports: [ "${PORT:-8080}:8080" ]
    restart: unless-stopped
volumes:
  pgdata:
