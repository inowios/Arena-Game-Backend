ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.arenacity.ApplicationKt.module ]
    }
    development = false
    development = ${?KTOR_DEVELOPMENT}
}

jwt {
    secret = "CHANGE-ME-IN-PRODUCTION"
    secret = ${?JWT_SECRET}
    issuer = "https://api.arenacity.app"
    issuer = ${?JWT_ISSUER}
    audience = "arenacity-mobile"
    audience = ${?JWT_AUDIENCE}
    realm = "arenacity"
    accessTokenExpiryMs = 43200000
    accessTokenExpiryMs = ${?JWT_ACCESS_TOKEN_EXPIRY_MS}
    refreshTokenExpiryMs = 2592000000
    refreshTokenExpiryMs = ${?JWT_REFRESH_TOKEN_EXPIRY_MS}
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/arenacity"
    jdbcUrl = ${?DATABASE_URL}
    user = "kushpe"
    user = ${?DATABASE_USER}
    password = ""
    password = ${?DATABASE_PASSWORD}
}

oauth {
    google {
        clientIds = ""
        clientIds = ${?GOOGLE_CLIENT_IDS}
    }
    apple {
        bundleId = "com.inowios.arenacity"
        bundleId = ${?APPLE_BUNDLE_ID}
    }
}

cors {
    allowedHosts = ""
    allowedHosts = ${?CORS_ALLOWED_HOSTS}
}

matchday {
    schedulerEnabled = true
    schedulerEnabled = ${?MATCHDAY_SCHEDULER_ENABLED}
}

iap {
    # accept "dev:" receipts (local testing only)
    devMode = false
    devMode = ${?IAP_DEV_MODE}
    google {
        packageName = "com.inowios.arenacity"
        packageName = ${?GOOGLE_PLAY_PACKAGE}
        # service-account JSON (contents) with access to the Play Console app (Financial data → View)
        serviceAccountJson = ""
        serviceAccountJson = ${?GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}
        # shared secret in the Pub/Sub push URL for Real-time developer notifications (voided purchases -> refunds):
        # https://<host>/api/v1/store/google/rtdn?token=<this>; empty keeps the endpoint closed
        rtdnToken = ""
        rtdnToken = ${?GOOGLE_PLAY_RTDN_TOKEN}
    }
    apple {
        bundleId = "com.inowios.arenacity"
        bundleId = ${?APPLE_BUNDLE_ID}
        # App Store Connect → Users and Access → Integrations → In-App Purchase key
        issuerId = ""
        issuerId = ${?APPSTORE_ISSUER_ID}
        keyId = ""
        keyId = ${?APPSTORE_KEY_ID}
        # contents of the .p8 key (PEM)
        privateKey = ""
        privateKey = ${?APPSTORE_PRIVATE_KEY}
        # path to Apple Root CA - G3 (.cer/.pem): verifies the signed transaction's certificate chain and is REQUIRED
        # (outside dev mode) for App Store Server Notifications V2 at https://<host>/api/v1/store/apple/notifications
        rootCertPath = ""
        rootCertPath = ${?APPSTORE_ROOT_CERT_PATH}
    }
}

ads {
    # trust client-reported rewards (POST /ads/reward); empty = only in development mode.
    # Production grants rewards from AdMob server-side verification callbacks (GET /api/v1/ads/ssv).
    clientRewards = ""
    clientRewards = ${?ADS_CLIENT_REWARDS}
}

links {
    # public https origin of this server (landing pages /l/{code}, /c/{code} and app-link association files)
    baseUrl = "http://localhost:8080"
    baseUrl = ${?PUBLIC_BASE_URL}
    scheme = "arenacity"
    androidPackage = "com.inowios.arenacity"
    androidPackage = ${?ANDROID_PACKAGE}
    # comma-separated SHA-256 fingerprints of the app signing certificate (Play Console → App integrity)
    androidCertSha256 = ""
    androidCertSha256 = ${?ANDROID_CERT_SHA256}
    iosTeamId = ""
    iosTeamId = ${?IOS_TEAM_ID}
    playStoreUrl = "https://play.google.com/store/apps/details?id=com.inowios.arenacity"
    playStoreUrl = ${?PLAY_STORE_URL}
    appStoreUrl = ""
    appStoreUrl = ${?APP_STORE_URL}
    # contact address shown on /privacy, /terms and /delete-account (required by the stores)
    supportEmail = ""
    supportEmail = ${?SUPPORT_EMAIL}
}

admin {
    # token for /admin/* and /metrics (header X-Admin-Token or Authorization: Bearer); at least 16 characters, empty = disabled
    token = ""
    token = ${?ADMIN_TOKEN}
}

legal {
    # publisher named on /privacy, /terms and /delete-account
    company = "Inowios"
    company = ${?LEGAL_COMPANY}
}

client {
    # clients below this version are asked to update (GET /api/v1/config). 0.2.0 is the first client that builds on the
    # land mask (rules.Lands.MIN_CLIENT; an older one validates the old square and draws the old map: the land migration
    # moves towns onto mask cells outside that square). Deploying this server needs it, and the 0.1.x clients in the
    # stores enforce no minimum: ship a client that enforces it first (docs/art/PERSPECTIVE-MAP.md in the mobile repo).
    minVersion = "0.2.0"
    minVersion = ${?CLIENT_MIN_VERSION}
}

push {
    fcm {
        serviceAccountJson = ${?FCM_SERVICE_ACCOUNT_JSON}
        projectId = ${?FCM_PROJECT_ID}
    }
}

manga {
    # folder with catalog.json and epNN/NN.jpg (the game's manga reader), filled by the mobile repo's tools/publish_manga.py
    dir = "manga"
    dir = ${?MANGA_DIR}
}
